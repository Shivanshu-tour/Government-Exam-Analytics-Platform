version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: examintel_postgres
    restart: always
    environment:
      POSTGRES_DB: examintel_db
      POSTGRES_USER: examintel_user
      POSTGRES_PASSWORD: examintel_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examintel_user -d examintel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examintel_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://examintel_user:examintel_password_2026@postgres:5432/examintel_db
      SECRET_KEY: examintel_super_secret_jwt_key_2026_change_in_production
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examintel_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
